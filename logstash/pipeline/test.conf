# Pipeline de test (semaine 2) : envoie un événement toutes les 60 s
# pour vérifier la chaîne Logstash -> Elasticsearch.
# Les pipelines CSV et JSON réels seront ajoutés en semaine 3.
input {
  heartbeat {
    interval => 60
    message => "logstash-ok"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logstash-test"
  }
}
