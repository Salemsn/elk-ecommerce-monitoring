# Pipeline JSON — fichiers déposés dans uploads/ (*.json, un objet JSON par ligne)
input {
  file {
    path => "/data/uploads/*.json"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-json"
    discover_interval => 5
    stat_interval => 1
    codec => json
  }
}

filter {
  # Ligne JSON invalide : on la garde, marquée en erreur (RM10)
  if "_jsonparsefailure" in [tags] {
    mutate { add_field => { "level" => "ERROR" "category" => "erreur" "event_type" => "parse_error" } }
  }

  mutate {
    convert => {
      "http_status"      => "integer"
      "response_time_ms" => "float"
      "amount"           => "float"
      "fraud_score"      => "float"
    }
  }

  # --- Traitements communs aux deux pipelines -------------------------------
  ruby {
    code => '
      p = event.get("[log][file][path]") || event.get("path")
      if p
        name = File.basename(p)
        event.set("source_file", name)
        event.set("file_id", File.basename(name, ".*"))
      end
    '
  }

  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
    remove_field => [ "timestamp" ]
  }

  mutate { uppercase => [ "level" ] }

  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geo"
      ecs_compatibility => disabled
      tag_on_failure => [ "_geoip_lookup_failure" ]
    }
  }

  if [category] { mutate { add_tag => [ "%{category}" ] } }
  if [fraud_score] and [fraud_score] > 0.7 { mutate { add_tag => [ "suspicious" ] } }

  fingerprint {
    source => [ "@timestamp", "service", "event_type", "session_id", "order_id", "message" ]
    concatenate_sources => true
    method => "SHA256"
    target => "[@metadata][fingerprint]"
  }

  mutate { remove_field => [ "event", "log", "host", "path", "@version" ] }
}

output {
  elasticsearch {
    hosts => [ "http://elasticsearch:9200" ]
    index => "logs-ecommerce-%{+YYYY.MM}"
    document_id => "%{[@metadata][fingerprint]}"
    data_stream => false
    ilm_enabled => false
    manage_template => true
    template => "/usr/share/logstash/templates/index-template.json"
    template_name => "logs-ecommerce"
    template_api => "composable"
    template_overwrite => true
  }
}
