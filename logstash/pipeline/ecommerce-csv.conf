# Pipeline CSV — fichiers déposés dans uploads/ (*.csv)
input {
  file {
    path => "/data/uploads/*.csv"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-csv"
    discover_interval => 5
    stat_interval => 1
  }
}

filter {
  # Fichiers créés sous Windows : retirer le retour chariot de fin de ligne.
  mutate { gsub => [ "message", "\r$", "" ] }

  csv {
    separator => ","
    skip_header => true
    skip_empty_columns => true
    columns => [ "timestamp", "level", "category", "event_type", "service", "message",
                 "http_status", "response_time_ms", "order_id", "product_id", "product_name",
                 "session_id", "user_id", "payment_method", "amount", "currency",
                 "fraud_score", "client_ip" ]
    convert => {
      "http_status"      => "integer"
      "response_time_ms" => "float"
      "amount"           => "float"
      "fraud_score"      => "float"
    }
  }

  # --- Traitements communs aux deux pipelines -------------------------------
  # Nom du fichier d'origine et identifiant (lien avec MongoDB files)
  ruby {
    code => '
      p = event.get("[log][file][path]") || event.get("path")
      if p
        name = File.basename(p)
        event.set("source_file", name)
        event.set("file_id", File.basename(name, ".*"))
      end
    '
  }

  # Date de l'événement (RM07) ; en cas d'échec : tag _dateparsefailure (RM10)
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
    remove_field => [ "timestamp" ]
  }

  mutate { uppercase => [ "level" ] }

  # Géolocalisation de l'adresse IP
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geo"
      ecs_compatibility => disabled
      tag_on_failure => [ "_geoip_lookup_failure" ]
    }
  }

  # Tags : catégorie (RM08) et transactions suspectes
  if [category] { mutate { add_tag => [ "%{category}" ] } }
  if [fraud_score] and [fraud_score] > 0.7 { mutate { add_tag => [ "suspicious" ] } }

  # Identifiant stable = pas de doublon si le fichier est réimporté (RM11)
  fingerprint {
    source => [ "@timestamp", "service", "event_type", "session_id", "order_id", "message" ]
    concatenate_sources => true
    method => "SHA256"
    target => "[@metadata][fingerprint]"
  }

  mutate { remove_field => [ "event", "log", "host", "path", "@version" ] }
}

output {
  elasticsearch {
    hosts => [ "http://elasticsearch:9200" ]
    index => "logs-ecommerce-%{+YYYY.MM}"
    document_id => "%{[@metadata][fingerprint]}"
    data_stream => false
    ilm_enabled => false
    manage_template => true
    template => "/usr/share/logstash/templates/index-template.json"
    template_name => "logs-ecommerce"
    template_api => "composable"
    template_overwrite => true
  }
}
